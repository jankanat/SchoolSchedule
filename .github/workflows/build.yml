name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tesseract language data (rus, kaz, eng)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in rus kaz eng; do curl -fsSL -o app/src/main/assets/tessdata/$l.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata; done
          ls -la app/src/main/assets/tessdata

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SchoolSchedule-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolSchedule-${{ github.run_number }}
          path: SchoolSchedule-${{ github.run_number }}.apk

      # выпуск в Releases — оттуда APK удобно скачать прямо на телефон
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SchoolSchedule сборка ${{ github.run_number }}
          prerelease: true
          files: SchoolSchedule-${{ github.run_number }}.apk

  render-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Render widgets to PNG
        run: gradle :app:testDebugUnitTest --tests "kz.alnazar.schedule.RenderTest" --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-render
          path: app/build/render/*.png
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: render-${{ github.run_number }}
          name: Проверка отрисовки ${{ github.run_number }}
          prerelease: true
          files: app/build/render/*.png
